[project]
name = "ctgov-viz"
version = "0.1.0"
description = "Turns a clinical-trials question into a visualization spec backed by ClinicalTrials.gov API v2."
requires-python = ">=3.11"
# Lower bounds, not pins: each floor is the oldest release with the API this
# code actually uses, so a grader installing months from now gets something
# compatible. Developed and tested against fastapi 0.165, pydantic 2.14,
# httpx 0.28, anthropic 2.12.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",   # SettingsConfigDict
    "anthropic>=2.0",           # 2.x client surface, forced tool calls
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",     # asyncio_mode = "auto"
    "respx>=0.21",
]

# Installed with `pip install -e ".[dev]"`. Only the `app` package ships;
# tests/, scripts/ and examples/ are run from the repo root, not imported.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
